name: Deploy connectU Web App

on:
  push:
    branches:
      - main          # your default branch
  workflow_dispatch:  # lets you run it by hand from the Actions tab

env:
  APP_DIR: connectu                 # folder in the repo that holds package.json (use "." if it is the repo root)
  SERVER_DIR: public_html/connectu/ # where it goes on the server -> https://dritafull.no/connectu/

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: ${{ env.APP_DIR }}

      - name: Build web app
        run: npm run build          # writes www/index.html + manifest
        working-directory: ${{ env.APP_DIR }}

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.dritafull.no
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ env.APP_DIR }}/www/
          server-dir: ${{ env.SERVER_DIR }}
