<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7ECE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="connectU">
<link rel="manifest" href="manifest.webmanifest">
<title>connectU</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap">
<style>/* connectU — brand: terracotta on warm blush, deep brown text (from the pitch deck) */
:root {
  --bg: #F7ECE8;        /* page blush */
  --surface: #FFFFFF;
  --card: #FBF6F3;
  --line: #EAD7CE;
  --ink: #3E1A0D;       /* deep brown */
  --ink-2: #6E5248;
  --accent: #C8603A;    /* terracotta */
  --accent-2: #A64425;
  --accent-soft: #F6DED3;
  --ok: #2F7A4B;
  --danger: #B3261E;
  --radius: 18px;
  --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
#root { height: 100%; display: flex; justify-content: center; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.phone {
  position: relative; width: 100%; max-width: 440px; height: 100%; display: flex; flex-direction: column;
  background: var(--bg); overflow: hidden;
}
@media (min-width: 600px) {
  #root { align-items: center; padding: 24px 0; }
  .phone { height: min(900px, 100%); border-radius: 36px; box-shadow: 0 30px 80px rgba(74, 29, 14, .18), 0 0 0 10px #2C2420; }
}

/* ---------- shared ---------- */
.logo { display: inline-flex; align-items: center; gap: .35em; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.logo-mark { display: inline-grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; }
.avatar { flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.fine { font-size: .8rem; color: var(--ink-2); text-align: center; margin: 4px 0 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack.top { margin-top: 20px; }
.row2 { display: flex; gap: 12px; }
.row2 > * { flex: 1; min-width: 0; }
.row2 > .narrow { flex: 0 0 36%; }

.btn {
  border: 0; border-radius: 999px; padding: 15px 20px; font-weight: 700; font-size: 1rem; background: var(--surface);
  color: var(--ink); width: 100%; transition: transform .1s ease, background .2s ease;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-2); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.ghost.light { color: #fff; border-color: rgba(255, 255, 255, .4); }
.btn.small { padding: 10px 16px; font-size: .9rem; width: auto; }
.btn.bankid { background: #39134C; color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.link-danger { background: transparent; color: var(--danger); }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }

.chip {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: .9rem; font-weight: 600;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.static .chip { background: var(--accent-soft); border-color: transparent; color: var(--ink); padding: 6px 12px; font-size: .84rem; }

.toast {
  position: absolute; left: 16px; right: 16px; top: calc(62px + env(safe-area-inset-top, 0px)); z-index: 60;
  background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 16px; font-size: .92rem; text-align: center;
  animation: pop .25s ease;
}
@keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- onboarding ---------- */
.screen { flex: 1; overflow-y: auto; padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.welcome { justify-content: space-between; background:
  radial-gradient(circle at 105% -5%, #EFCDBF 0 28%, transparent 28.2%),
  radial-gradient(circle at -15% 92%, #EFD1C6 0 30%, transparent 30.2%), var(--bg); }
.welcome-top { padding-top: 24px; }
.welcome h1 { font-size: 2.2rem; line-height: 1.08; letter-spacing: -.03em; margin: 28px 0 10px; text-wrap: balance; }
.lead { color: var(--ink-2); font-size: 1.05rem; line-height: 1.45; margin: 0; }
.welcome-cards { position: relative; height: 240px; width: 300px; max-width: 100%; margin: 10px auto; }
.mini-card {
  position: absolute; width: 190px; background: var(--surface); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 14px 40px rgba(74, 29, 14, .14);
}
.mini-card span { color: var(--ink-2); font-size: .85rem; }
.mini-card b { margin-top: 8px; }
.mini-card.back { left: 0; top: 0; transform: rotate(-8deg); opacity: .9; }
.mini-card.front { left: 50%; top: 20px; transform: translateX(-50%) rotate(4deg); width: 210px; }
.mini-actions { display: flex; gap: 10px; margin-top: 10px; }
.mini-actions span { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }
.mini-actions .heart { background: var(--accent); border-color: var(--accent); color: #fff; }

.form h2 { font-size: 1.7rem; line-height: 1.12; letter-spacing: -.02em; margin: 4px 0 0; text-wrap: balance; }
.form h3 { font-size: 1.05rem; margin: 18px 0 2px; }
.form label { font-weight: 700; font-size: .9rem; margin-top: 6px; }
.form input, .form textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 14px; font-size: 1rem;
}
.form input:focus, .form textarea:focus { border-color: var(--accent); outline: none; }
.form input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
.form .btn { margin-top: 12px; }
.back { align-self: flex-start; background: var(--surface); border: 0; width: 40px; height: 40px; border-radius: 50%; font-size: 1.6rem; line-height: 1; padding-bottom: 4px; }
.back.inline { flex: none; }
.step { margin: 6px 0 0; color: var(--accent); font-weight: 700; font-size: .85rem; }
.error { color: var(--danger); font-size: .88rem; margin: 0; }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: .85rem; margin: 6px 0 -6px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.pref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.pref {
  text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px;
}
.pref b { font-size: .98rem; margin-top: 6px; }
.pref span { font-size: .8rem; color: var(--ink-2); }
.pref .pref-icon { font-size: 1.2rem; color: var(--ink); }
.pref.on { background: var(--accent-soft); border-color: var(--accent); }
.toggle { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px 10px; font-weight: 600; font-size: .92rem; }
.toggle.on { border-color: var(--accent); background: var(--accent-soft); }
.life { display: flex; flex-direction: column; gap: 6px; }
.seg { display: flex; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 9px 4px; font-size: .86rem; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--accent); color: #fff; }

/* ---------- main shell ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; }
.pill { font-size: .8rem; font-weight: 700; background: var(--surface); border-radius: 999px; padding: 6px 12px; color: var(--ink-2); }
.tab-content { flex: 1; overflow-y: auto; min-height: 0; }
.tabbar {
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabbar button { position: relative; flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 700; color: var(--ink-2); padding: 6px 0; }
.tabbar .tab-icon { font-size: 1.25rem; line-height: 1.2; }
.tabbar button.on { color: var(--accent); }
.badge { position: absolute; top: 0; right: calc(50% - 22px); background: var(--accent); color: #fff; border-radius: 999px; font-size: .68rem; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; }

/* ---------- discover ---------- */
.discover { height: 100%; display: flex; flex-direction: column; padding: 4px 16px 12px; }
.deck { position: relative; flex: 1; min-height: 420px; }
.card {
  position: absolute; inset: 0; background: var(--surface); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 16px 40px rgba(74, 29, 14, .14); touch-action: pan-y; user-select: none;
}
.card.top { cursor: grab; }
.card.top:active { cursor: grabbing; }
.card.under { transform: scale(.95) translateY(10px); opacity: .9; }
.card-hero { position: relative; flex: 0 0 44%; min-height: 170px; color: #fff; display: flex; align-items: flex-end; padding: 18px 20px; }
.hero-avatar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -62%); width: 96px; height: 96px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .85); display: grid; place-items: center; font-size: 2.6rem; font-weight: 800; }
.hero-text h2 { margin: 0; font-size: 1.7rem; letter-spacing: -.02em; }
.hero-text p { margin: 2px 0 0; opacity: .92; }
.score { position: absolute; top: 14px; right: 14px; background: rgba(255, 255, 255, .95); color: var(--ink); font-weight: 800; font-size: .85rem; border-radius: 999px; padding: 6px 12px; }
.stamp { position: absolute; top: 22px; font-size: 1.6rem; font-weight: 900; letter-spacing: .08em; padding: 4px 12px; border: 3px solid; border-radius: 10px; pointer-events: none; }
.stamp.like { left: 18px; color: #fff; transform: rotate(-14deg); }
.stamp.nope { right: 18px; top: 60px; color: #fff; transform: rotate(14deg); }
.card-body { flex: 1; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.bio { margin: 0; line-height: 1.45; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons span { background: #E7F2EA; color: var(--ok); border-radius: 999px; padding: 5px 10px; font-size: .8rem; font-weight: 700; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin: 0; }
.facts dt { font-size: .74rem; color: var(--ink-2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; font-weight: 600; font-size: .94rem; font-variant-numeric: tabular-nums; }
.verified { color: var(--ok); font-weight: 700; font-size: .85rem; margin: 0; }
.actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 10px 4px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; font-size: 1.6rem; display: grid; place-items: center; box-shadow: 0 8px 20px rgba(74, 29, 14, .14); flex: none; }
.round.pass { background: var(--surface); color: var(--ink-2); }
.round.like { background: var(--accent); color: #fff; }
.hint { flex: 1; text-align: center; font-size: .8rem; color: var(--ink-2); margin: 0; }
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 24px; }
.empty.small { height: auto; padding: 24px 0; }
.empty h2 { margin: 0; font-size: 1.4rem; text-wrap: balance; }
.empty .btn { width: auto; }
.empty-mark { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 2rem; }

.overlay { position: absolute; inset: 0; z-index: 50; background: rgba(46, 18, 8, .94); display: flex; align-items: center; justify-content: center; padding: 24px; animation: pop .25s ease; }
.match-box { text-align: center; color: #fff; display: flex; flex-direction: column; gap: 12px; width: 100%; }
.match-box .eyebrow { color: #F3B79F; }
.match-box h2 { font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.match-box .muted { color: #EBCFC4; }
.pair { display: flex; align-items: center; justify-content: center; gap: 0; margin: 14px 0; }
.pair .avatar { border: 4px solid #fff; }
.pair-heart { width: 46px; height: 46px; margin: 0 -10px; z-index: 1; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 1.4rem; border: 3px solid #fff; }

/* ---------- pages ---------- */
.page { padding: 4px 20px 24px; }
.page-title { font-size: 1.9rem; letter-spacing: -.03em; margin: 6px 0 8px; }
.section { margin: 22px 0 10px; font-size: 1rem; }
.list { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.match-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 18px; padding: 10px 10px 10px 12px; }
.match-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 0; }
.match-text { min-width: 0; display: flex; flex-direction: column; }
.match-text .muted { font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-btn { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: .82rem; font-weight: 700; }
.group-btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.group-card { margin-top: 14px; background: var(--ink); color: #fff; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.group-card .eyebrow { color: #F3B79F; }
.group-card .muted { color: #E5C9BE; margin: 2px 0 0; }
.group-card .btn { background: var(--accent); color: #fff; flex: none; }
.waiting { display: flex; gap: 14px; flex-wrap: wrap; }
.wait { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .82rem; font-weight: 600; }
.wait .avatar { filter: grayscale(.5) opacity(.75); }

.chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.chat-head > div { display: flex; flex-direction: column; }
.chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.chat-intro { text-align: center; margin: 6px 0 14px; color: var(--ink-2); font-size: .86rem; }
.chat-intro p { margin: 0 0 4px; font-weight: 700; color: var(--ink); }
.bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; animation: pop .2s ease; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
.bubble.them { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 6px; }
.chat-input { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.chat-input input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 999px; padding: 12px 16px; background: var(--bg); }
.chat-input input:focus { outline: none; border-color: var(--accent); }
.send { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 1.1rem; flex: none; }

.group-strip { display: flex; justify-content: space-between; align-items: center; background: var(--surface); border-radius: 14px; padding: 12px 14px; margin: 12px 0; font-size: .92rem; }
.homes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.home { background: var(--surface); border-radius: 20px; overflow: hidden; }
.home-img { height: 110px; position: relative; }
.featured { position: absolute; top: 10px; left: 10px; background: #fff; color: var(--accent); font-weight: 800; font-size: .74rem; border-radius: 999px; padding: 4px 10px; text-transform: uppercase; letter-spacing: .06em; }
.rooms { position: absolute; bottom: 10px; left: 12px; color: #fff; font-weight: 800; font-size: 1.05rem; }
.home-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.home-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
.home-tags span { background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.home .btn { align-self: flex-start; }
.applied { color: var(--ok); font-weight: 700; margin: 0; font-size: .9rem; }

.sheet-wrap { align-items: flex-end; padding: 0; background: rgba(46, 18, 8, .55); }
.sheet { width: 100%; background: var(--bg); border-radius: 26px 26px 0 0; padding: 12px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 92%; overflow-y: auto; }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-bottom: 6px; }
.sheet h2 { margin: 0; font-size: 1.35rem; text-wrap: balance; }
.sheet h3 { margin: 8px 0 0; font-size: 1rem; }
.sheet .muted { margin: 0; }
.contract { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.contract span { font-size: .88rem; color: var(--ink-2); line-height: 1.4; }
.contract.on { border-color: var(--accent); background: var(--accent-soft); }
.tag { display: inline-block; background: var(--ok); color: #fff !important; font-size: .7rem !important; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }

.me-card { display: flex; gap: 16px; align-items: center; margin: 8px 0 14px; }
.me-card h2 { margin: 0; font-size: 1.4rem; }
.me-card p { margin: 2px 0; }
.page .bio { margin-bottom: 14px; }
.page .facts { background: var(--surface); border-radius: 18px; padding: 14px 16px; margin-bottom: 14px; }
.confirm { background: var(--surface); border-radius: 16px; padding: 14px; }
.confirm p { margin: 0 0 10px; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
